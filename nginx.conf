# Nginx inside the Docker image (see Dockerfile). Dokploy/Traefik terminates HTTPS in front of it.
# One build serves three domains:
#   biznorx.com         -> main site (recruitment)
#   realty.biznorx.com  -> /realty/ page as its homepage (optional, once DNS is added)
#   tech.biznorx.com    -> /tech/ page as its homepage (optional, once DNS is added)
# Add all three domains to the same Dokploy app.
map $host $division {
    default             "";
    realty.biznorx.com  realty;
    tech.biznorx.com    tech;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # www -> non-www (one canonical domain for SEO)
    if ($host = www.biznorx.com) {
        return 301 https://biznorx.com$request_uri;
    }

    # Old biznorx.com pages -> closest new page (301 keeps links and Google rankings)
    location ~ ^/(services|process|whychooseus)/?$ { return 301 /people/; }
    location ~ ^/digital/?$ { return 301 /tech/; }
    location ~ ^/cv/?$ { return 301 /careers/#apply; }

    # Shared build files and images work on every domain
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        # Division subdomains: "/" shows the division page; any other page lives on the main domain
        if ($division != "") {
            rewrite ^/$ /$division/ last;
        }
        set $other_page "";
        if ($division != "") { set $other_page "y"; }
        if ($uri ~ "^/(realty|tech)/") { set $other_page ""; }
        if ($uri ~ "^/(_next|images)/|\.(txt|xml|ico|png|svg|webmanifest)$") { set $other_page ""; }
        if ($other_page = "y") {
            return 301 https://biznorx.com$request_uri;
        }

        # /realty/ and /tech/ stay on biznorx.com (canonical). Once realty./tech.biznorx.com have DNS and are
        # added in Dokploy, they also show these pages via the map above.

        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
